appId: com.tunnelgate.app
productName: TunnelGate
npmRebuild: false
beforePack: build/beforePack.js
afterPack: build/afterPack.mac.js
# Stable, version-less artifact names so the website can link straight at
# github.com/<repo>/releases/latest/download/<name> and always hit the newest
# build. NSIS overrides this with a "-Setup-" name (see the nsis: block).
artifactName: ${productName}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/icons/**/*
  - package.json
extraResources:
  # cloudflared itself is bundled per-platform (see win/mac/linux blocks below) so
  # a mac build doesn't also carry the Windows .exe. build/beforePack.js fetches
  # the right one into resources/ before packaging; it lands at
  # <resourcesPath>/cloudflared[.exe] — where cloudflaredResolver.ts looks.
  - from: native/rdp-addon/build/Release/
    to: rdp-addon
    filter:
      - "*.dll"
      - "*.dylib"
      - "*.node"
      - "*.cnf"
      - "ossl-modules/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.png
  extraResources:
    - from: resources/cloudflared.exe
      to: cloudflared.exe
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: resources/icons/icon.png
  category: public.app-category.utilities
  hardenedRuntime: false
  gatekeeperAssess: false
  # Hardened runtime + ad-hoc signing is applied in afterPack.mac.js instead of
  # electron-builder's built-in signing, which corrupts Electron Framework on
  # macOS 26+. Must run before the DMG is created, not after.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Required for the native WiFi-detection addon (native/wifi-native) to be
  # able to request Location authorization and show the real system prompt —
  # without this, CLLocationManager's authorization request silently no-ops.
  extendInfo:
    NSLocationUsageDescription: TunnelGate reads your current WiFi network name to verify you are connecting from an approved office network before allowing remote desktop access.
    NSLocationWhenInUseUsageDescription: TunnelGate reads your current WiFi network name to verify you are connecting from an approved office network before allowing remote desktop access.
  extraResources:
    - from: native/wifi-native/build/Release/
      to: wifi-native
      filter:
        - "*.node"
    - from: resources/cloudflared
      to: cloudflared
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icons/
  category: Utility
  extraResources:
    - from: resources/cloudflared
      to: cloudflared
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  artifactName: ${productName}-Setup-${arch}.${ext}
publish: null
